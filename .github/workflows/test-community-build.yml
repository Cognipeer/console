name: Test Console Build Time

on:
  workflow_dispatch:
  push:
    branches:
      - ci/build-speed-test

permissions:
  contents: read
  packages: read

concurrency:
  group: test-console-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: cognipeer-azure-runners
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Console without push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          provenance: false
          tags: console:test