name: Console Community Release

run-name: Community release ${{ inputs.release_tag || github.event.workflow_run.head_branch }}

# Publishes a GitHub Release for a vX.Y.Z-community tag once the community
# build for that tag has succeeded.
#
# - It starts when "Console Community Build" completes, not on the tag push, so
#   no release page exists for a tag whose build failed or is still running.
#   For a tag push, the head_branch of the triggering run is the tag name and
#   its head_sha is the tagged commit.
# - A build started by hand with workflow_dispatch reports the branch it was
#   dispatched on, not the tag, so it cannot be mapped to a tag and is skipped.
#   Run this workflow by hand for such a tag.
# - A tag that already has a release (published or draft) is left alone.
# - The release notes are generated by GitHub from merged PR titles and become
#   part of the public release page.
#
# If the build workflow is renamed, update `workflows:` below and
# BUILD_WORKFLOW in the step.

on:
  workflow_run:
    workflows: ['Console Community Build']
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z-community tag to publish a release for
        required: true
        type: string
      dry_run:
        description: Only print the release that would be created
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: community-release-${{ inputs.release_tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: cognipeer-azure-runners
    timeout-minutes: 10
    permissions:
      contents: write # create the release and generate its notes
      actions: read # list the community builds that succeeded
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_WORKFLOW: build-community.yml
        run: |
          set -euo pipefail

          API="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}"
          WORK=$(mktemp -d "${RUNNER_TEMP:-/tmp}/community-release.XXXXXX")
          trap 'rm -rf "${WORK}"' EXIT

          # get <path> <output file>: an HTTP error prints the response and fails.
          get() {
            curl --fail-with-body --silent --show-error --retry 3 \
              --connect-timeout 10 --max-time 60 \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --output "$2" "${API}/$1" \
              || { echo "::error::GET $1 failed." >&2; [[ ! -f "$2" ]] || cat "$2" >&2; return 1; }
          }

          # post <path> <request file> <output file>
          post() {
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 120 \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/json' \
              --data-binary "@$2" --output "$3" "${API}/$1" \
              || { echo "::error::POST $1 failed." >&2; [[ ! -f "$3" ]] || cat "$3" >&2; return 1; }
          }

          # paginate <path> <query, empty or ending in &> <jq filter: page -> array> <output file>
          # Writes every page of a list endpoint as one JSON array. The filter must
          # return one entry per item, because a page of fewer than 100 ends the loop.
          paginate() {
            local page=1 count
            : > "${WORK}/pages"
            while :; do
              get "$1?$2per_page=100&page=${page}" "${WORK}/page.json" || return 1
              jq -c "$3" "${WORK}/page.json" > "${WORK}/chunk.json" || return 1
              cat "${WORK}/chunk.json" >> "${WORK}/pages"
              count=$(jq 'length' "${WORK}/chunk.json") || return 1
              [[ "${count}" -ge 100 ]] || break
              page=$((page + 1))
              [[ "${page}" -le 30 ]] \
                || { echo "::error::$1 returned more than 3000 items; stopping." >&2; return 1; }
            done
            jq -c -s 'add // []' "${WORK}/pages" > "$4"
          }

          if [[ "${EVENT_NAME}" == workflow_dispatch ]]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${RUN_HEAD_BRANCH}"
          fi
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-community$ ]] \
            || { echo "::error::Tag '${TAG}' is not in the vX.Y.Z-community format."; exit 1; }

          # Published and draft releases both count.
          paginate 'releases' '' '[.[] | .tag_name]' "${WORK}/releases.json" || exit 1
          EXISTS=$(jq -r --arg tag "${TAG}" 'index($tag) != null' "${WORK}/releases.json")
          if [[ "${EXISTS}" == true ]]; then
            echo "A release for ${TAG} already exists. Nothing to do."
            exit 0
          fi

          # The tag must exist. For a build-triggered run it must also still point
          # at the commit that was built.
          get "git/ref/tags/${TAG}" "${WORK}/ref.json" \
            || { echo "::error::Could not read tag ${TAG}; it must exist in ${GITHUB_REPOSITORY}."; exit 1; }
          TAG_SHA=$(jq -r '.object.sha' "${WORK}/ref.json")
          TAG_TYPE=$(jq -r '.object.type' "${WORK}/ref.json")
          COMMIT_SHA="${TAG_SHA}"
          if [[ "${TAG_TYPE}" == tag ]]; then
            get "git/tags/${TAG_SHA}" "${WORK}/tag-object.json" || exit 1
            COMMIT_SHA=$(jq -r '.object.sha' "${WORK}/tag-object.json")
          fi
          if [[ "${EVENT_NAME}" == workflow_run \
            && "${RUN_HEAD_SHA}" != "${TAG_SHA}" && "${RUN_HEAD_SHA}" != "${COMMIT_SHA}" ]]; then
            echo "::error::Tag ${TAG} no longer points at the commit that was built (${RUN_HEAD_SHA}). No release created."
            exit 1
          fi

          # The notes start at the newest older community tag whose build succeeded,
          # so the changes in a tag that never built appear in the next release.
          # Without a start tag GitHub finds no previous tag for these tags and lists
          # the whole history of the repository.
          paginate "actions/workflows/${BUILD_WORKFLOW}/runs" 'event=push&status=success&' \
            '[.workflow_runs[] | .head_branch]' "${WORK}/built.json" || exit 1
          PREVIOUS=$(jq -r --arg tag "${TAG}" '
            def key: capture("^v(?<a>[0-9]+)\\.(?<b>[0-9]+)\\.(?<c>[0-9]+)-community$")
                     | [.a, .b, .c | tonumber];
            ($tag | key) as $current
            | [.[] | select(type == "string" and test("^v[0-9]+\\.[0-9]+\\.[0-9]+-community$"))
                   | select(key < $current)]
            | max_by(key) // empty' "${WORK}/built.json")

          jq -n --arg tag "${TAG}" --arg previous "${PREVIOUS}" \
            '{tag_name: $tag} + (if $previous == "" then {} else {previous_tag_name: $previous} end)' \
            > "${WORK}/notes-request.json"
          post 'releases/generate-notes' "${WORK}/notes-request.json" "${WORK}/notes.json" || exit 1

          # make_latest "legacy" leaves the choice of "Latest" to GitHub, which uses
          # the release creation date and the higher semantic version. The API
          # default, true, would mark every new release as Latest, including one
          # made for an older tag.
          jq -n --arg tag "${TAG}" --arg sha "${COMMIT_SHA}" --slurpfile notes "${WORK}/notes.json" \
            '{tag_name: $tag, target_commitish: $sha, name: $tag, body: $notes[0].body,
              draft: false, prerelease: false, make_latest: "legacy"}' \
            > "${WORK}/release-request.json"

          if [[ "${DRY_RUN}" == true ]]; then
            echo "Dry run: would publish ${TAG} at ${COMMIT_SHA}, with notes starting at ${PREVIOUS:-the default start}."
            echo "::group::Release notes"
            jq -r '.body' "${WORK}/notes.json"
            echo "::endgroup::"
            exit 0
          fi

          echo "Publishing ${TAG} at ${COMMIT_SHA}, with notes starting at ${PREVIOUS:-the default start}."
          post 'releases' "${WORK}/release-request.json" "${WORK}/release.json" || exit 1
          URL=$(jq -r '.html_url' "${WORK}/release.json")
          echo "Published ${URL}"
          echo "Published release ${TAG}: ${URL}" >> "${GITHUB_STEP_SUMMARY}"
