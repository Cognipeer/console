services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_PROVIDER=sqlite
      - MAIN_DB_NAME=console_main
      - SQLITE_DATA_DIR=/app/data/sqlite
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env.local or environment}
      - CACHE_PROVIDER=memory
      - RATE_LIMIT_PROVIDER=memory
      # Self-hosted installs are on-prem: with SUPPORT_BASE_URL alone the Help
      # action lands on the Support login instead of failing.
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-onprem}
      # Cognipeer Support. Leave empty to hide every Support entry point.
      # SUPPORT_HANDOFF_SECRET must equal CRM's SUPPORT_HANDOFF_SECRET_CONSOLE.
      - SUPPORT_BASE_URL=${SUPPORT_BASE_URL:-}
      - SUPPORT_CRM_API_URL=${SUPPORT_CRM_API_URL:-}
      - SUPPORT_HANDOFF_SECRET=${SUPPORT_HANDOFF_SECRET:-}
      # On-prem, single-organization bootstrap: set REGISTRATION_MODE=disabled
      # in your environment/.env and fill these to create the one organization
      # + owner user on first boot instead of leaving public signup open.
      - REGISTRATION_MODE=${REGISTRATION_MODE:-open}
      - BOOTSTRAP_ORG_NAME=${BOOTSTRAP_ORG_NAME:-}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - BOOTSTRAP_ADMIN_NAME=${BOOTSTRAP_ADMIN_NAME:-Administrator}
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ── Optional: MongoDB (uncomment to use MongoDB instead of SQLite) ──
  # Requires: DB_PROVIDER=mongodb and MONGODB_URI=mongodb://mongo:27017
  # On-prem (DEPLOYMENT_MODE=onprem, the default above) tenant data is kept in
  # the same physical database as MAIN_DB_NAME — no separate tenant_{slug}
  # database is created. Override with MONGODB_SINGLE_DATABASE=false to opt out.
  #
  # mongo:
  #   image: mongo:7
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo-data:/data/db
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3

  # ── Optional: Redis (uncomment for redis cache/rate-limiting) ──
  # Requires: CACHE_PROVIDER=redis and REDIS_URL=redis://redis:6379
  #
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3

volumes:
  app-data:
  # mongo-data:
  # redis-data:
