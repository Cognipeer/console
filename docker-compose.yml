services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_PROVIDER=sqlite
      - MAIN_DB_NAME=console_main
      - SQLITE_DATA_DIR=/app/data/sqlite
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env.local or environment}
      - CACHE_PROVIDER=memory
      - RATE_LIMIT_PROVIDER=memory
      # Self-hosted installs are on-prem: with SUPPORT_BASE_URL alone the Help
      # action lands on the Support login instead of failing.
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-onprem}
      # Cognipeer Support. Leave empty to hide every Support entry point.
      # SUPPORT_HANDOFF_SECRET must equal CRM's SUPPORT_HANDOFF_SECRET_CONSOLE.
      - SUPPORT_BASE_URL=${SUPPORT_BASE_URL:-}
      - SUPPORT_CRM_API_URL=${SUPPORT_CRM_API_URL:-}
      - SUPPORT_HANDOFF_SECRET=${SUPPORT_HANDOFF_SECRET:-}
      # On-prem, single-organization bootstrap: set REGISTRATION_MODE=disabled
      # in your environment/.env and fill these to create the one organization
      # + owner user on first boot instead of leaving public signup open.
      - REGISTRATION_MODE=${REGISTRATION_MODE:-open}
      - BOOTSTRAP_ORG_NAME=${BOOTSTRAP_ORG_NAME:-}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - BOOTSTRAP_ADMIN_NAME=${BOOTSTRAP_ADMIN_NAME:-Administrator}
      # Agent Background Execution (docs/guide/agent-background-execution.md)
      # Hard ceiling for a synchronous agent turn; MUST be below the shortest infra timeout in the deployment
      - AGENT_SYNC_TIMEOUT_MS=${AGENT_SYNC_TIMEOUT_MS:-180000}
      # Server-operated upper bound on a background run, independent of the agent's own maxWallClockMs
      - AGENT_BACKGROUND_MAX_DURATION_MS=${AGENT_BACKGROUND_MAX_DURATION_MS:-1800000}
      # Simple per-tenant cap on simultaneous queued+running background runs
      - AGENT_BACKGROUND_MAX_CONCURRENT_RUNS_PER_TENANT=${AGENT_BACKGROUND_MAX_CONCURRENT_RUNS_PER_TENANT:-10}
      # Per-project cap on queued+running background runs (0 = only the tenant cap)
      - AGENT_BACKGROUND_MAX_CONCURRENT_RUNS_PER_PROJECT=${AGENT_BACKGROUND_MAX_CONCURRENT_RUNS_PER_PROJECT:-0}
      # Background runs executed at once per node (dedicated queue)
      - AGENT_RUN_CONCURRENCY=${AGENT_RUN_CONCURRENCY:-4}
      # Republish a queued run that no worker picked up after this long
      - AGENT_RUN_REQUEUE_AFTER_MS=${AGENT_RUN_REQUEUE_AFTER_MS:-120000}
      # Retention TTL for AgentRun records (userMessage/result)
      - AGENT_RUN_RETENTION_DAYS=${AGENT_RUN_RETENTION_DAYS:-30}
      # How often a background worker writes heartbeatAt while running
      - AGENT_RUN_HEARTBEAT_INTERVAL_MS=${AGENT_RUN_HEARTBEAT_INTERVAL_MS:-15000}
      # A running run whose heartbeat is older than this is orphaned by the reconciler
      - AGENT_RUN_HEARTBEAT_STALE_MS=${AGENT_RUN_HEARTBEAT_STALE_MS:-45000}
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ── Optional: MongoDB (uncomment to use MongoDB instead of SQLite) ──
  # Requires: DB_PROVIDER=mongodb and MONGODB_URI=mongodb://mongo:27017
  # On-prem (DEPLOYMENT_MODE=onprem, the default above) tenant data is kept in
  # the same physical database as MAIN_DB_NAME — no separate tenant_{slug}
  # database is created. Override with MONGODB_SINGLE_DATABASE=false to opt out.
  #
  # mongo:
  #   image: mongo:7
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo-data:/data/db
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3

  # ── Optional: Redis (uncomment for redis cache/rate-limiting) ──
  # Requires: CACHE_PROVIDER=redis and REDIS_URL=redis://redis:6379
  #
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3

volumes:
  app-data:
  # mongo-data:
  # redis-data:
